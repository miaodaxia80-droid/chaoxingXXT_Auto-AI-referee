# 小内存服务器专用：
# 1. 跳过前端构建（用本机预构建的 .frontend-dist），避免 node 压垮 1.6G 内存
# 2. 超星对云机房 IP 有 403 风控（302 → passport403.html），故采用
#    network_mode: host 复用宿主机上的出站代理（按部署环境填写）
# 3. 复制 .env.server.example 为 .env.server，并填写自己的 Origin、网段和代理
# 启动：docker compose --env-file .env.server -f docker-compose.server.yml up -d --build
services:
  chaoxing:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: chaoxing-console:server
    container_name: chaoxing-console
    network_mode: host
    volumes:
      - ./chaoxing-data:/app/data
    environment:
      CX_ALLOWED_ORIGINS: "${CX_ALLOWED_ORIGINS:?Set CX_ALLOWED_ORIGINS in .env.server}"
      CX_ALLOWED_CLIENT_NETWORKS: "${CX_ALLOWED_CLIENT_NETWORKS:-[]}"
      CX_SECURE_COOKIES_OVERRIDE: "${CX_SECURE_COOKIES_OVERRIDE:-false}"
      CX_WORKER_MAX_WORKERS: "${CX_WORKER_MAX_WORKERS:-2}"
      # requests/urllib 自动读取这三个变量：
      # 超星对云机房 IP 有 403 风控，按部署环境填写可用的 HTTP 代理；留空表示直连。
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost}"
    # 防火墙与应用层同时限制 5002；主机防火墙配置见 deploy/
    command: ["sh", "-c", "python -m alembic upgrade head && exec chaoxing-app serve --host 0.0.0.0 --port 5002"]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
