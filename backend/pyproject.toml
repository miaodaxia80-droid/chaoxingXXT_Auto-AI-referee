[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chaoxing-app"
version = "0.1.0"
description = "Secure self-hosted Chaoxing task console"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "beautifulsoup4>=4.14,<5",
  "cryptography>=45,<46",
  "ddddocr>=1.5.6,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.43,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
chaoxing-app = "chaoxing_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaoxing_app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/chaoxing_app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chaoxing_app"]
